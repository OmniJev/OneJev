name: onejev

# Backend profiles. Run one at a time; each serves the API and playground on :8000.
#   torch      NVIDIA / CUDA PyTorch server
#   rocm       AMD / ROCm PyTorch server
#   gguf       llama.cpp on NVIDIA / CUDA
#   gguf-rocm  llama.cpp on AMD / ROCm
#   vulkan     llama.cpp on AMD / Intel (Vulkan)
#   cpu        llama.cpp on CPU (fallback)
#
# Prefer docker/start.sh (auto-detects) or `docker compose --profile <name> up` in docker/.
# Do not combine two backend profiles: they all bind :8000.

# NVIDIA GPU reservation.
x-gpu-nvidia: &gpu-nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

# AMD passthrough. seccomp:unconfined is required for ROCm.
# GID defaults are Debian/Ubuntu; docker/start.sh auto-detects the real ones.
x-gpu-amd: &gpu-amd
  devices:
    - /dev/kfd
    - /dev/dri
  group_add:
    - "${AMD_VIDEO_GID:-44}"
    - "${AMD_RENDER_GID:-109}"
  security_opt:
    - seccomp:unconfined

# Vulkan passthrough (AMD/Intel render nodes).
x-gpu-vulkan: &gpu-vulkan
  devices:
    - /dev/dri
  group_add:
    - "${DRI_RENDER_GID:-109}"
  security_opt:
    - seccomp:unconfined

# llama.cpp backends: the official llama.cpp server image with qev installed, running
# `qev serve --gguf` as on the host (it downloads the GGUF and its mmproj).
x-qev-gguf: &qev-gguf
  command:
    - serve
    - --gguf
    - ${QEV_GGUF:-mradermacher/OneJev-4B-GGUF:Q8_0}
    - --llama-server
    - /app/llama-server
    - --host
    - 0.0.0.0
    - --port
    - "8000"
  ports:
    - "${QEV_PORT:-8000}:8000"
  environment:
    HF_HOME: /data/hf
    HF_TOKEN: ${HF_TOKEN:-}
    QEV_DEBIAS: ${QEV_DEBIAS:-1}
    # Optional ROCm override for unknown gfx archs. Left without a value so it
    # is injected only when the project environment provides it: an empty value
    # makes ROCr force-empty the arch and hide every GPU.
    HSA_OVERRIDE_GFX_VERSION:
  volumes:
    - hf-cache:/data/hf
  restart: unless-stopped

services:
  # PyTorch / CUDA server.
  qev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: torch
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
    image: onejev/qev:torch
    profiles: ["torch"]
    command:
      - serve
      - --model
      - ${QEV_MODEL:-OmniJev/OneJev-4B}
      - --multimodal
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${QEV_PORT:-8000}:8000"
    environment:
      HF_HOME: /data/hf
      HF_TOKEN: ${HF_TOKEN:-}
      QEV_DEBIAS: ${QEV_DEBIAS:-1}
    volumes:
      - hf-cache:/data/hf
    shm_size: "16gb"
    restart: unless-stopped
    <<: *gpu-nvidia

  # PyTorch / ROCm server.
  qev-rocm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: rocm
      args:
        TORCH_ROCM_INDEX_URL: ${TORCH_ROCM_INDEX_URL:-https://download.pytorch.org/whl/rocm6.3}
    image: onejev/qev:rocm
    profiles: ["rocm"]
    command:
      - serve
      - --model
      - ${QEV_MODEL:-OmniJev/OneJev-4B}
      - --multimodal
      - --no-cuda-graphs
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${QEV_PORT:-8000}:8000"
    environment:
      HF_HOME: /data/hf
      HF_TOKEN: ${HF_TOKEN:-}
      QEV_DEBIAS: ${QEV_DEBIAS:-1}
      HSA_OVERRIDE_GFX_VERSION:
    volumes:
      - hf-cache:/data/hf
    shm_size: "16gb"
    restart: unless-stopped
    <<: *gpu-amd

  # llama.cpp on NVIDIA / CUDA.
  qev-gguf:
    <<: [*qev-gguf, *gpu-nvidia]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gguf
      args:
        LLAMA_IMAGE: ghcr.io/ggml-org/llama.cpp:server-cuda
    image: onejev/qev:gguf-cuda
    profiles: ["gguf"]

  # llama.cpp on AMD / ROCm.
  qev-gguf-rocm:
    <<: [*qev-gguf, *gpu-amd]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gguf
      args:
        LLAMA_IMAGE: ghcr.io/ggml-org/llama.cpp:server-rocm
    image: onejev/qev:gguf-rocm
    profiles: ["gguf-rocm"]

  # llama.cpp on AMD / Intel via Vulkan.
  qev-gguf-vulkan:
    <<: [*qev-gguf, *gpu-vulkan]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gguf
      args:
        LLAMA_IMAGE: ghcr.io/ggml-org/llama.cpp:server-vulkan
    image: onejev/qev:gguf-vulkan
    profiles: ["vulkan"]

  # llama.cpp on CPU (no GPU).
  qev-gguf-cpu:
    <<: *qev-gguf
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gguf
      args:
        LLAMA_IMAGE: ghcr.io/ggml-org/llama.cpp:server
    image: onejev/qev:gguf-cpu
    profiles: ["cpu"]

volumes:
  hf-cache:
