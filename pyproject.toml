[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qev"
version = "0.1.0"
description = "Open System One decision model: typed, calibrated decisions behind a TypeSafe-compatible API"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "transformers>=5.0",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "typesafe-sdk>=0.6"]
train = ["peft>=0.13", "pyyaml>=6", "pyarrow>=14"]

[project.scripts]
qev = "qev.cli:main"

[tool.setuptools.packages.find]
include = ["qev*"]

[tool.setuptools.package-data]
qev = ["playground/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
