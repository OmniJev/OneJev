[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qev"
version = "0.1.4"
description = "Open System One decision model: typed, calibrated decisions behind a TypeSafe-compatible API"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "transformers>=5.0",
  "pillow>=10",
  "jinja2>=3.1",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9; python_version < '3.11'",
  "pytest>=8; python_version >= '3.11'",
  "httpx>=0.27", "pyyaml>=6", "pyarrow>=14",
]
torch = ["torch>=2.6", "torchvision>=0.21", "accelerate>=1.0", "safetensors>=0.4"]
train = ["torch>=2.6", "torchvision>=0.21", "accelerate>=1.0", "safetensors>=0.4", "peft>=0.13", "pyyaml>=6", "pyarrow>=14"]

[project.scripts]
qev = "qev.cli:main"

[tool.setuptools.packages.find]
include = ["qev*"]

[tool.setuptools.package-data]
qev = ["playground/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: optional integration tests using a local checkpoint and CUDA",
  "browser: optional Playwright browser integration tests",
]
